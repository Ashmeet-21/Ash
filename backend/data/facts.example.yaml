resume:
  section_order: [Header, Objective, Skills, Projects, Experience, Education, Certifications]
  # {role}, {areas} and {tools} are the only slots the tailor fills.
  objective_template: >-
    Computer Science student graduating May 2027 seeking a {role} role, bringing hands-on
    project experience in {areas} using {tools}.
  objective: >-
    Computer Science student graduating May 2027 seeking a Security Analyst role, bringing hands-on
    project experience in security monitoring, backend APIs and LLM tooling using Python, FastAPI,
    PostgreSQL, Docker, Wazuh, SIEM, Linux and Claude API.
  skills:
    Languages: [Python, TypeScript, JavaScript, SQL, Bash]
    Frameworks and Tools: [FastAPI, Next.js, React, PostgreSQL, Docker, Git, GitHub Actions, Linux]
    Security and AI: [SIEM, Wazuh, Log analysis, MITRE ATT&CK, OWASP Top 10, Claude API, LLMs]
  skills_line_max_chars: 110
  projects:
    - title: LogSentry, LLM-Assisted Alert Triage
      tech: Python, FastAPI, PostgreSQL, Wazuh, Claude API, Docker
      dates: Jan 2026 to Apr 2026
      bullets:
        - Built a FastAPI service that ingests Wazuh alerts into PostgreSQL and groups 2,000+ daily events into incidents.
        - Mapped alert rules to MITRE ATT&CK techniques and used the Claude API to draft triage notes for analyst review.
        - Packaged the stack with Docker Compose and wrote Bash scripts to replay sample logs for testing.
    - title: PhishGuard, Phishing URL Classifier
      tech: TypeScript, Next.js, FastAPI, scikit-learn, PostgreSQL
      dates: Sep 2025 to Dec 2025
      bullets:
        - Trained a scikit-learn classifier on 40,000 labeled URLs and served predictions through a FastAPI endpoint.
        - Built a Next.js dashboard with Tailwind CSS and deployed it on Netlify with GitHub Actions CI and pytest checks.
        - Reviewed the app against the OWASP Top 10 and fixed input validation and rate limiting gaps.
  experience:
    - title: IT Support Co-op
      org: Example Credit Union
      dates: May 2025 to Aug 2025
      bullets:
        - Resolved 300+ hardware, network and account tickets for 150 staff across three branches.
        - Wrote Python and Bash scripts to automate Linux workstation setup, cutting setup time from 2 hours to 30 minutes.
  education:
    - title: Bachelor of Science, Computer Science
      org: Example University
      dates: Sep 2023 to May 2027
  certifications:
    - CompTIA Security+ (2025)

# Phrases the Objective must never contain (overclaiming).
banned_phrases:
  - production experience
  - years of experience
  - expert
  - seasoned
  - senior
  - extensive experience
  - proven track record
  - industry experience

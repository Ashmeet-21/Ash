# Skill taxonomy: canonical name, aliases (matched case-insensitively on word boundaries),
# `cs_aliases` (matched case-sensitively, for short or ambiguous words like "Go"),
# a family (skills in the same family count as "adjacent" evidence for each other)
# and a kind (hard | soft). Labels follow ESCO where a matching concept exists.
# Add skills freely; the matcher, scorer and validator all read this file.

skills:
